<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="../logo-car-rental.png" alt="Bootstrap" width="100" />
        </a>
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a class="nav-link active text-black" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-black" href="#">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-black" href="#">Gallery</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-black" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-black" href="#">Contact</a>
          </li>
          <div class="vr border-5 opacity-100"></div>
          <a class="btn btn-danger mx-3 w-40 border-1" href="#" role="button">Login</a>
        </ul>
      </div>
    </nav>
    <div id="carouselExample" class="carousel slide">
      <div class="carousel-inner">
        <h5 class="text-black d-flex align-items-center">First slide label</h5>

        <div class="carousel-item active">
          <img src="../alphard.jpg" class="d-block w-100 bg-opacity-25 object-fit-fill" alt="..." />
        </div>
        <div class="carousel-item">
          <img src="../fortuner.jpg" class="d-block w-100" alt="..." />
        </div>
        <!-- <div class="carousel-item">
          <img src="..." class="d-block w-100" alt="..." />
        </div> -->
        <div class="carousel-caption d-none d-md-block align-items-center d-flex">
          <h5>First slide label</h5>
          <p>Some representative placeholder content for the first slide.</p>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
